[package]
name = "atk-device"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
atk-protocol = { path = "../atk-protocol" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows = { version = "0.58", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Foundation",
] }

[dev-dependencies]
serde_json = "1"
