[package]
name = "windows-input"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
ghub-lua = { path = "../ghub-lua" }
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
